<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Context resent with every request, with and without automatic handoff</title>
  <desc id="d">Without handoff, the context sent with each request keeps climbing until compaction. With automatic handoff, each session returns to a small size at the threshold, and the shaded gap is the tokens no longer resent.</desc>
  <rect x="1" y="1" width="878" height="398" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="70" y="38" font-size="19" font-weight="600" fill="#1f2328">Every request resends the whole conversation</text>
  <g font-size="13.5" fill="#57606a">
    <rect x="70" y="54" width="22" height="4" rx="2" fill="#cf6a3b"/><text x="100" y="60">Without handoff: grows until compaction</text>
    <rect x="370" y="54" width="22" height="4" rx="2" fill="#13786b"/><text x="400" y="60">With automatic handoff</text>
    <rect x="590" y="49" width="22" height="14" rx="3" fill="#13786b" fill-opacity="0.16"/><text x="620" y="60">Tokens no longer resent</text>
  </g>
